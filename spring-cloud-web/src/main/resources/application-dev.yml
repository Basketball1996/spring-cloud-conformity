server:
  port: 18080
  servlet:
    context-path: /conformity-web

spring:
  application:
    name: conformity-web
  cloud:
    nacos:
      discovery:
        server-addr: 173.21.122.170:8848,173.21.122.153:8850,173.21.122.35:8852
        namespace: spring-cloud-conformity
        group: spring-cloud-conformity
        username: nacos
        password: nacos
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://173.21.122.35:3306/spring_cloud_conformity?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      #配置初始化大小、最小、最大线程数
      initial-size: 5
      min-idle: 5
      #CPU核数+1，也可以大些但不要超过20，数据库加锁时连接过多性能下降
      max-active: 20
      # 最大等待时间，内网：800，外网：1200（三次握手1s）
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      #配置一个连接在池中最大空间时间，单位是毫秒
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      # 设置从连接池获取连接时是否检查连接有效性，true检查，false不检查
      test-on-borrow: true
      # 设置从连接池归还连接时是否检查连接有效性，true检查，false不检查
      test-on-return: true
      #可以支持PSCache（提升写入、查询效率）
      pool-prepared-statements: true
      max-open-prepared-statements: 20
      #配置监控统计拦截的filters，去掉后监控界面sql无法统计，wall:用于防火墙
      filter:
        stat:
          log-slow-sql: true
          slow-sql-millis: 1000
        wall:
          config:
            multi-statement-allow: true

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.conformity.dal.model

# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true    # 开启knife4j,无需添加@EnableKnife4j注解
  setting:
    language: zh_cn   #中文
    swagger-model-name: 实体列表   #默认为: Swagger Models
  basic: # 开启Swagger的Basic认证功能,默认是false
    enable: true
    username: admin
    password: 123456
